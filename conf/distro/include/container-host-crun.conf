# Container host configuration fragment: crun
#
# Include from local.conf to set up a container host with only crun:
#
#   require conf/distro/include/meta-virt-host.conf
#   require conf/distro/include/container-host-crun.conf
#   MACHINE = "qemux86-64"
#   bitbake container-image-host
#
# Sets CONTAINER_PROFILE for a host that runs OCI runtime bundles with crun
# directly, with no container engine. BUNDLED_CONTAINERS entries without a
# runtime use crun:
#
#   BUNDLED_CONTAINERS = "myapp-container:autostart"

CONTAINER_PROFILE = "crun"
