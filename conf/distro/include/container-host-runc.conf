# Container host configuration fragment: runc
#
# Include from local.conf to set up a container host with only runc:
#
#   require conf/distro/include/meta-virt-host.conf
#   require conf/distro/include/container-host-runc.conf
#   MACHINE = "qemux86-64"
#   bitbake container-image-host
#
# Sets CONTAINER_PROFILE for a host that runs OCI runtime bundles with runc
# directly, with no container engine. BUNDLED_CONTAINERS entries without a
# runtime use runc:
#
#   BUNDLED_CONTAINERS = "myapp-container:autostart"

CONTAINER_PROFILE = "runc"
